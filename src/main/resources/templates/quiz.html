<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Quiz</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="/style.css"/>
    <script th:inline="javascript">
        const QUESTION_WORD = /*[[${question.word}]]*/ '';
        // Страница перезагружается на каждый вопрос, поэтому комбо живёт в sessionStorage.
        const COMBO_KEY = 'combo';
        // Вопрос, на котором уже ошиблись, комбо не наращивает, даже если потом выбрать верный ответ.
        let missed = false;

        function readCombo() {
            try { return parseInt(sessionStorage.getItem(COMBO_KEY), 10) || 0; } catch (e) { return 0; }
        }

        function setCombo(value, animation) {
            try { sessionStorage.setItem(COMBO_KEY, String(value)); } catch (e) {}
            renderCombo(value);
            if (!animation) return;
            const combo = document.getElementById('combo');
            combo.classList.remove('combo-bump', 'combo-reset');
            void combo.offsetWidth; // перезапуск CSS-анимации
            combo.classList.add(animation);
        }

        function renderCombo(value) {
            const combo = document.getElementById('combo');
            combo.querySelector('.combo-value').textContent = value;
            combo.classList.toggle('combo-active', value > 0);
        }

        document.addEventListener('DOMContentLoaded', function() { renderCombo(readCombo()); });

        // Звуки синтезируются Web Audio API, файлов нет. AudioContext создаётся на первом клике —
        // до жеста пользователя браузер звук не пустит.
        let audioCtx = null;

        function tone(freq, start, duration, type, volume, endFreq) {
            const t = audioCtx.currentTime + start;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + duration + 0.02);
        }

        function playSound(correct, combo) {
            try {
                audioCtx = audioCtx || new AudioContext();
                if (correct) {
                    // Каждый шаг комбо поднимает перезвон на полтона, потолок — октава.
                    const base = 660 * Math.pow(2, Math.min(combo, 12) / 12);
                    tone(base, 0, 0.15, 'triangle', 0.25);
                    tone(base * 1.5, 0.09, 0.3, 'triangle', 0.25);
                } else {
                    tone(180, 0, 0.25, 'square', 0.06, 90);
                }
            } catch (e) {}
        }

        function btnClick(btn, answer) {
            fetch('/answer?word=' + encodeURIComponent(QUESTION_WORD) + '&correct=' + answer.correct,
                  { method: 'POST' });
            if (answer.correct) {
                if (!missed) setCombo(readCombo() + 1, 'combo-bump');
                playSound(true, readCombo());
                document.querySelectorAll('.answer-btn').forEach(function(answerBtn) {
                    answerBtn.disabled = true;
                });
                btn.classList.add('answer-correct');
                btn.textContent = btn.textContent + ' · Верно!';
                setTimeout(function() { window.location.reload(); }, 1000);
            } else {
                missed = true;
                if (readCombo() > 0) setCombo(0, 'combo-reset');
                playSound(false);
                btn.style.color = 'red';
                btn.textContent = btn.textContent + " - " + btn.title;
                btn.disabled = true;
            }
        }
        function skip() {
            setCombo(0);
            window.location.reload();
        }
        function deleteWord(word) {
            if (!confirm("Удалить «" + word + "» из словаря?")) return;
            fetch('/word?word=' + encodeURIComponent(word), { method: 'DELETE' })
                .then(function(response) {
                    if (response.ok) { window.location.reload(); return; }
                    response.text().then(function(text) { alert("Не удалось удалить: " + (text || response.status)); });
                });
        }
    </script>
</head>
<body>
<div class="container">
    <nav class="nav">
        <a href="/">Quiz</a>
        <a href="/words">Слова</a>
    </nav>
    <main class="card">
        <div class="combo" id="combo" title="Правильных ответов подряд">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
            </svg>
            Комбо: <span class="combo-value">0</span>
        </div>
        <h1 class="prompt" th:text="${question.word}">Слово</h1>
        <div class="answers">
            <button th:each="answer: ${question.answersList}"
                    class="answer-btn"
                    th:text="${answer.word}"
                    th:onClick="btnClick(this, [[${answer}]])"
                    th:title="${answer.translate}">
            </button>
        </div>
        <div class="skip-actions">
            <button type="button" class="skip-btn" onclick="skip()">
                <svg class="icon-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                    <path d="M3 21v-5h5"/>
                </svg>
                Пропустить
            </button>
            <button type="button" class="skip-btn" th:onclick="deleteWord([[${question.word}]])">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6"/>
                    <path d="M14 11v6"/>
                </svg>
                Знаю — удалить
            </button>
        </div>
    </main>
</div>
</body>
</html>
