<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <title>Quiz</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="/style.css"/>
    <script src="/prefs.js"></script>
    <script th:inline="javascript">
        // Вкладка: quiz — выбор из вариантов, type — ввод перевода, cards — вспомнить про себя и оценить,
        // mix — каждый вопрос в случайном из трёх режимов.
        const MODE = /*[[${mode}]]*/ 'quiz';
        // Первый вопрос приходит вместе со страницей, следующие — через GET /question без перезагрузки.
        let question = /*[[${question}]]*/ null;
        // Комбо живёт в sessionStorage, чтобы пережить переход на «Слова» и обратно.
        const COMBO_KEY = 'combo';
        // На вопрос уходит один ответ — первый клик: ошибка, исправленная следом, остаётся ошибкой.
        let answered = false;
        // Верный ответ найден, ждём автоперехода: «Пропустить» в этот момент просто листает дальше.
        let solved = false;
        let nextTimer = null;
        // Режим текущего вопроса: совпадает с MODE, кроме «Микса» и предложений во «Вводе».
        let questionMode = null;
        // Варианты квиза спрятаны до «Вспомнил» или ответ карточки ещё не открыт.
        let hidden = false;

        function readCombo() {
            try { return parseInt(sessionStorage.getItem(COMBO_KEY), 10) || 0; } catch (e) { return 0; }
        }

        function setCombo(value, animation) {
            try { sessionStorage.setItem(COMBO_KEY, String(value)); } catch (e) {}
            renderCombo(value);
            if (!animation) return;
            const combo = document.getElementById('combo');
            combo.classList.remove('combo-bump', 'combo-reset');
            void combo.offsetWidth; // перезапуск CSS-анимации
            combo.classList.add(animation);
        }

        function renderCombo(value) {
            const combo = document.getElementById('combo');
            combo.querySelector('.combo-value').textContent = value;
            combo.classList.toggle('combo-active', value > 0);
        }

        // «Микс» не повторяет режим дважды подряд. Предложения не печатают — их оценивают как карточку.
        function pickMode(q) {
            if (MODE !== 'mix') return MODE === 'type' && q.sentence ? 'cards' : MODE;
            const modes = ['quiz', 'type', 'cards'].filter(function(mode) {
                return mode !== questionMode && !(mode === 'type' && q.sentence);
            });
            return modes[Math.floor(Math.random() * modes.length)];
        }

        function renderQuestion(q) {
            question = q;
            answered = false;
            solved = false;
            hidden = false;
            questionMode = pickMode(q);
            document.getElementById('prompt').textContent = q.word;
            document.getElementById('retry').hidden = !q.retry;
            document.querySelector('#due .due-value').textContent = q.dueCount;
            const stage = document.getElementById('stage');
            stage.replaceChildren();
            if (questionMode === 'quiz') renderChoices(stage, q);
            else if (questionMode === 'type') renderTyping(stage);
            else renderCard(stage);
            updateSkipHint();
        }

        // Подсказка «пробел» у «Пропустить» — только когда пробел и правда пропускает.
        function updateSkipHint() {
            document.getElementById('skip-key').hidden = questionMode !== 'quiz' || hidden;
        }

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function revealButton(text, onclick) {
            const btn = el('button', 'reveal-btn', text);
            btn.type = 'button';
            btn.append(el('span', 'key-hint', 'пробел'));
            btn.onclick = onclick;
            return btn;
        }

        function renderChoices(stage, q) {
            const answers = el('div', 'answers');
            q.answersList.forEach(function(answer, i) {
                const btn = el('button', 'answer-btn');
                btn.type = 'button';
                btn.append(el('span', 'answer-key', i + 1), el('span', 'answer-text', answer.word));
                btn.onclick = function() { btnClick(btn, answer); };
                answers.appendChild(btn);
            });
            stage.appendChild(answers);
            if (!gateOn()) return;
            // «Сначала вспомнить»: без вариантов перед глазами приходится вспоминать, а не исключать.
            hidden = true;
            answers.hidden = true;
            stage.appendChild(revealButton('Вспомнил — показать варианты', showChoices));
        }

        function showChoices() {
            hidden = false;
            document.querySelector('#stage .answers').hidden = false;
            document.querySelector('#stage .reveal-btn').remove();
            updateSkipHint();
        }

        function toggleGate() {
            togglePref('gate', 'on', 'off');
            if (!gateOn() && hidden && questionMode === 'quiz') showChoices();
        }

        function renderTyping(stage) {
            const form = el('form', 'type-form');
            const input = el('input', 'type-input');
            input.autocomplete = 'off';
            input.spellcheck = false;
            input.setAttribute('autocapitalize', 'off');
            input.placeholder = 'латиницей или кириллицей';
            form.append(input, el('div', 'type-hint', 'Enter — проверить, пустой Enter — не помню'));
            form.onsubmit = function(e) {
                e.preventDefault();
                if (answered) nextQuestion(); else submitTyped(input);
            };
            stage.appendChild(form);
            input.focus();
        }

        function submitTyped(input) {
            answered = true;
            input.readOnly = true;
            const params = new URLSearchParams({word: question.word, input: input.value});
            fetch('/typed?' + params.toString(), { method: 'POST' })
                .then(function(response) {
                    if (response.ok) {
                        response.json().then(function(verdict) { showVerdict(input, verdict); });
                        return;
                    }
                    answered = false;
                    input.readOnly = false;
                    response.text().then(function(text) { alert("Не удалось проверить: " + (text || response.status)); });
                });
        }

        // Без диакритики (ACCENT) засчитывается, но ответ ждёт Enter, чтобы успеть увидеть подсвеченные буквы.
        function showVerdict(input, verdict) {
            const form = input.closest('form');
            form.querySelector('.type-hint').remove();
            if (verdict === 'WRONG') {
                const gaveUp = input.value.trim() === '';
                if (gaveUp) input.placeholder = 'не помню';
                input.classList.add('type-wrong');
                if (readCombo() > 0) setCombo(0, 'combo-reset');
                if (!gaveUp) playSound(false);
            } else {
                solved = true;
                input.classList.add(verdict === 'CORRECT' ? 'type-correct' : 'type-accent');
                setCombo(readCombo() + 1, 'combo-bump');
                playSound(true, readCombo());
            }
            form.appendChild(revealAnswer(question, verdict === 'ACCENT'));
            if (verdict === 'CORRECT') nextTimer = setTimeout(nextQuestion, 1000);
            else form.appendChild(el('div', 'type-hint', 'Enter — дальше'));
        }

        // Верный ответ кириллицей и латиницей; markDiacritics подсвечивает в латинице č ć š ž đ.
        function revealAnswer(q, markDiacritics) {
            const box = el('div', 'reveal');
            const answer = q.answersList.find(function(a) { return a.correct; }).word;
            box.append(el('div', 'reveal-answer', answer));
            if (q.answerLatin === answer) return box;
            const latin = el('div', 'reveal-latin');
            if (markDiacritics) {
                q.answerLatin.split(/([čćšžđČĆŠŽĐ])/).forEach(function(part, i) {
                    latin.append(i % 2 ? el('mark', null, part) : part);
                });
            } else {
                latin.textContent = q.answerLatin;
            }
            box.append(latin);
            return box;
        }

        function renderCard(stage) {
            hidden = true;
            stage.appendChild(revealButton('Показать ответ', showCard));
        }

        function showCard() {
            hidden = false;
            const grades = el('div', 'answers');
            grades.append(gradeButton('Вспомнил', 1, true), gradeButton('Не вспомнил', 2, false));
            document.getElementById('stage').replaceChildren(revealAnswer(question, false), grades);
        }

        function gradeButton(text, key, correct) {
            const btn = el('button', 'answer-btn ' + (correct ? 'grade-yes' : 'grade-no'));
            btn.type = 'button';
            btn.append(el('span', 'answer-key', key), el('span', 'answer-text', text));
            btn.onclick = function() { grade(correct); };
            return btn;
        }

        // Самооценка карточки. «Не вспомнил» — без звука ошибки: честное «не знаю» не наказываем.
        function grade(correct) {
            if (answered) return;
            answered = true;
            fetch('/answer?word=' + encodeURIComponent(question.word) + '&correct=' + correct + '&recall=true',
                  { method: 'POST' });
            if (correct) {
                setCombo(readCombo() + 1, 'combo-bump');
                playSound(true, readCombo());
            } else if (readCombo() > 0) {
                setCombo(0, 'combo-reset');
            }
            nextQuestion();
        }

        function nextQuestion() {
            clearTimeout(nextTimer);
            fetch('/question')
                .then(function(response) { return response.json(); })
                .then(renderQuestion)
                .catch(function() { window.location.reload(); });
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderCombo(readCombo());
            renderQuestion(question);
        });

        // 1–4 — варианты ответа или оценка карточки, пробел — открыть варианты/ответ, иначе пропустить.
        // Клавиши с модификаторами и ввод в поля не трогаем.
        // Цифру берём из e.code (физическая клавиша): e.key зависит от раскладки, а у владельца их четыре.
        window.addEventListener('keydown', function(e) {
            if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
            if (e.target.tagName === 'INPUT') return;
            const digit = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
            if (digit) {
                if (hidden) return;
                const btn = document.querySelectorAll('#stage .answer-btn')[Number(digit[1]) - 1];
                if (btn && !btn.disabled) btn.click();
            } else if (e.code === 'Space') {
                e.preventDefault(); // иначе пробел ещё и нажмёт кнопку в фокусе
                if (hidden) {
                    if (questionMode === 'quiz') showChoices(); else showCard();
                } else if (questionMode !== 'cards') {
                    skip();
                }
            } else if ((e.code === 'Enter' || e.code === 'NumpadEnter') && questionMode === 'type' && answered) {
                e.preventDefault();
                nextQuestion();
            }
        }, true);

        // Звуки синтезируются Web Audio API, файлов нет. AudioContext создаётся на первом клике —
        // до жеста пользователя браузер звук не пустит.
        let audioCtx = null;

        function tone(freq, start, duration, type, volume, endFreq) {
            const t = audioCtx.currentTime + start;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + duration + 0.02);
        }

        function playSound(correct, combo) {
            if (!soundOn()) return;
            try {
                audioCtx = audioCtx || new AudioContext();
                if (correct) {
                    // Каждый шаг комбо поднимает перезвон на полтона, потолок — октава.
                    const base = 660 * Math.pow(2, Math.min(combo, 12) / 12);
                    tone(base, 0, 0.15, 'triangle', 0.25);
                    tone(base * 1.5, 0.09, 0.3, 'triangle', 0.25);
                } else {
                    tone(180, 0, 0.25, 'square', 0.06, 90);
                }
            } catch (e) {}
        }

        function btnClick(btn, answer) {
            const firstTry = !answered;
            if (firstTry) {
                answered = true;
                fetch('/answer?word=' + encodeURIComponent(question.word) + '&correct=' + answer.correct,
                      { method: 'POST' });
            }
            if (answer.correct) {
                solved = true;
                if (firstTry) setCombo(readCombo() + 1, 'combo-bump');
                playSound(true, readCombo());
                document.querySelectorAll('.answer-btn').forEach(function(answerBtn) {
                    answerBtn.disabled = true;
                });
                btn.classList.add('answer-correct');
                nextTimer = setTimeout(nextQuestion, 1000);
            } else {
                if (readCombo() > 0) setCombo(0, 'combo-reset');
                playSound(false);
                btn.classList.add('answer-wrong');
                const hint = document.createElement('span');
                hint.className = 'answer-hint';
                hint.textContent = answer.translate;
                btn.appendChild(hint);
                btn.disabled = true;
            }
        }
        function skip() {
            if (!solved) setCombo(0);
            nextQuestion();
        }
        function deleteWord() {
            const word = question.word;
            if (!confirm("Удалить «" + word + "» из словаря?")) return;
            fetch('/word?word=' + encodeURIComponent(word), { method: 'DELETE' })
                .then(function(response) {
                    if (response.ok) { nextQuestion(); return; }
                    response.text().then(function(text) { alert("Не удалось удалить: " + (text || response.status)); });
                });
        }
    </script>
</head>
<body>
<div class="container">
    <nav class="nav">
        <a href="/" th:classappend="${mode == 'quiz'} ? 'active'">Quiz</a>
        <a href="/type" th:classappend="${mode == 'type'} ? 'active'">Ввод</a>
        <a href="/cards" th:classappend="${mode == 'cards'} ? 'active'">Карточки</a>
        <a href="/mix" th:classappend="${mode == 'mix'} ? 'active'">Микс</a>
        <a href="/words">Слова</a>
        <button type="button" class="nav-toggle" onclick="toggleSound()" title="Звук вкл/выкл">
            <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H2v6h4l5 4V5z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M19 5a10 10 0 0 1 0 14"/>
            </svg>
            <svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H2v6h4l5 4V5z"/>
                <path d="M22 9l-6 6"/>
                <path d="M16 9l6 6"/>
            </svg>
        </button>
        <button type="button" class="nav-toggle" onclick="toggleTheme()" title="Светлая/тёмная тема">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>
            </svg>
        </button>
    </nav>
    <main class="card">
        <div class="card-top">
            <div class="combo" id="combo" title="Правильных ответов подряд">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                </svg>
                Комбо: <span class="combo-value">0</span>
            </div>
            <div class="due-badge" id="due" title="Слов, которым по расписанию пора на повторение">
                К повторению: <span class="due-value">0</span>
            </div>
            <div class="retry-badge" id="retry" title="Здесь недавно была ошибка" hidden>Повтор</div>
            <button type="button" class="gate-toggle" th:if="${mode == 'quiz' or mode == 'mix'}"
                    onclick="toggleGate()" title="Прятать варианты, пока не вспомнишь перевод сам">
                Сначала вспомнить
            </button>
        </div>
        <h1 class="prompt" id="prompt" th:text="${question.word}">Слово</h1>
        <div id="stage"></div>
        <div class="skip-actions">
            <button type="button" class="skip-btn" onclick="skip()">
                <svg class="icon-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                    <path d="M3 21v-5h5"/>
                </svg>
                Пропустить
                <span class="key-hint" id="skip-key">пробел</span>
            </button>
            <button type="button" class="skip-btn" onclick="deleteWord()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6"/>
                    <path d="M14 11v6"/>
                </svg>
                Знаю — удалить
            </button>
        </div>
    </main>
</div>
</body>
</html>
