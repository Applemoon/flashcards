quiz:
  answer-size: 4
  # слово с ошибкой вернётся на этом по счёту следующем вопросе
  retry-after: 4
  word-filename: "/questions.txt"
  word-write-filename: "./src/main/resources/questions.txt"
  # расписание показов (FSRS): читается и пишется по этому пути, относительно cwd
  progress-filename: "./src/main/resources/progress.txt"
